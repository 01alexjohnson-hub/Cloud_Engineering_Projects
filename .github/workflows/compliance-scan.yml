name: Compliance Scan

on:
  pull_request:
    branches: [main]
    paths:
      - 'compliance-cicd-pipeline/**'
      - '.github/workflows/compliance-scan.yml'
  push:
    branches: [main]
    paths:
      - 'compliance-cicd-pipeline/**'
      - '.github/workflows/compliance-scan.yml'

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  WORKING_DIR: compliance-cicd-pipeline
  TF_DIR: compliance-cicd-pipeline/terraform-sample

jobs:
  compliance-scan:
    name: NIST 800-53 Compliance Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compliance-cicd-pipeline

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Stage 1: tflint ──
      - name: Install tflint
        run: |
          curl -sL https://github.com/terraform-linters/tflint/releases/latest/download/tflint_linux_amd64.zip -o tflint.zip
          unzip tflint.zip
          sudo mv tflint /usr/local/bin/
          rm tflint.zip
          tflint --version

      - name: Run tflint
        working-directory: compliance-cicd-pipeline/terraform-sample
        run: |
          tflint --init
          tflint

      # ── Stage 2: Terraform Validate ──
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: compliance-cicd-pipeline/terraform-sample
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: compliance-cicd-pipeline/terraform-sample
        run: terraform validate

      # ── Stage 3: Checkov ──
      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        working-directory: compliance-cicd-pipeline/terraform-sample
        run: |
          checkov -d . --config-file ../.checkov.yaml --output cli --output json --output-file-path console,checkov-results.json
        continue-on-error: true

      - name: Upload Checkov results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-results
          path: compliance-cicd-pipeline/terraform-sample/checkov-results.json

      # ── Stage 4: Terraform Plan ──
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init (with backend)
        working-directory: compliance-cicd-pipeline/terraform-sample
        run: terraform init -backend=false

      - name: Terraform Plan
        working-directory: compliance-cicd-pipeline/terraform-sample
        run: |
          terraform plan -out=tfplan.binary -input=false
          terraform show -json tfplan.binary > tfplan.json
