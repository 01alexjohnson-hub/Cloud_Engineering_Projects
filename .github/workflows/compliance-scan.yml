name: Compliance Scan

on:
  pull_request:
    branches: [main]
    paths:
      - 'compliance-cicd-pipeline/**'
      - '.github/workflows/compliance-scan.yml'
  push:
    branches: [main]
    paths:
      - 'compliance-cicd-pipeline/**'
      - '.github/workflows/compliance-scan.yml'

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  WORKING_DIR: compliance-cicd-pipeline
  TF_DIR: compliance-cicd-pipeline/terraform-sample

jobs:
  compliance-scan:
    name: NIST 800-53 Compliance Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compliance-cicd-pipeline

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Stage 1: tflint ──
      - name: Install tflint
        run: |
          curl -sL https://github.com/terraform-linters/tflint/releases/latest/download/tflint_linux_amd64.zip -o tflint.zip
          unzip tflint.zip
          sudo mv tflint /usr/local/bin/
          rm tflint.zip
          tflint --version

      - name: Run tflint
        working-directory: compliance-cicd-pipeline/terraform-sample
        run: |
          tflint --init
          tflint

      # ── Stage 2: Terraform Validate ──
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: compliance-cicd-pipeline/terraform-sample
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: compliance-cicd-pipeline/terraform-sample
        run: terraform validate
