name: Compliance Scan

on:
  pull_request:
    branches: [main]
    paths:
      - 'compliance-cicd-pipeline/**'
      - '.github/workflows/compliance-scan.yml'
  push:
    branches: [main]
    paths:
      - 'compliance-cicd-pipeline/**'
      - '.github/workflows/compliance-scan.yml'

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  WORKING_DIR: compliance-cicd-pipeline
  TF_DIR: compliance-cicd-pipeline/terraform-sample
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  compliance-scan:
    name: NIST 800-53 Compliance Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compliance-cicd-pipeline

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Stage 1: tflint ──
      - name: Install tflint
        run: |
          curl -sL https://github.com/terraform-linters/tflint/releases/latest/download/tflint_linux_amd64.zip -o tflint.zip
          unzip tflint.zip
          sudo mv tflint /usr/local/bin/
          rm tflint.zip
          tflint --version

      - name: Run tflint
        working-directory: compliance-cicd-pipeline/terraform-sample
        run: |
          tflint --init
          tflint

      # ── Stage 2: Terraform Validate ──
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: compliance-cicd-pipeline/terraform-sample
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: compliance-cicd-pipeline/terraform-sample
        run: terraform validate

      # ── Stage 3: Checkov ──
      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        working-directory: compliance-cicd-pipeline/terraform-sample
        run: |
          checkov -d . --config-file ../.checkov.yaml --output cli --output json --output-file-path console,checkov-results.json
        continue-on-error: true

      - name: Upload Checkov results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-results
          path: compliance-cicd-pipeline/terraform-sample/checkov-results.json

      # ── Stage 4: Terraform Plan ──
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init (with backend)
        working-directory: compliance-cicd-pipeline/terraform-sample
        run: terraform init -backend=false

      - name: Terraform Plan
        working-directory: compliance-cicd-pipeline/terraform-sample
        run: |
          terraform plan -out=tfplan.binary -input=false
          terraform show -json tfplan.binary > tfplan.json

      # ── Stage 5: OPA Policy Evaluation ──
      - name: Install OPA
        run: |
          curl -sL https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static -o opa
          chmod +x opa
          sudo mv opa /usr/local/bin/
          opa version

      - name: Run OPA policy evaluation
        working-directory: compliance-cicd-pipeline
        run: |
          opa eval -d policies/opa/ -i terraform-sample/tfplan.json "data.terraform" --format raw | python3 -c "
          import json, sys
          val = json.load(sys.stdin)
          findings = []
          for pkg, data in val.items():
              if 'deny' in data:
                  for d in data['deny']:
                      findings.append(d)
                      print(f'DENY: {d}')
          if not findings:
              print('All OPA policies passed.')
          else:
              print(f'\n{len(findings)} policy violation(s) found.')
          " | tee opa-results.txt
        continue-on-error: true

      - name: Upload OPA results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opa-results
          path: compliance-cicd-pipeline/opa-results.txt

      # ── Stage 6: Compliance Report ──
      - name: Generate compliance report
        working-directory: compliance-cicd-pipeline
        run: |
          python3 scripts/generate_report.py \
            terraform-sample/checkov-results.json \
            opa-results.txt \
            compliance-report.md

      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-report
          path: compliance-cicd-pipeline/compliance-report.md

      # ── Stage 7: PR Comment ──
      - name: Post compliance report to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: compliance-cicd-pipeline/compliance-report.md

      # ── Gate: Fail if violations found ──
      - name: Check for policy violations
        working-directory: compliance-cicd-pipeline
        run: |
          FINDINGS=$(grep -c "^DENY:" opa-results.txt 2>/dev/null || echo "0")
          if [ "$FINDINGS" -gt "0" ]; then
            echo "FAILED: $FINDINGS OPA policy violation(s) found. See compliance report for details."
            exit 1
          fi
          echo "All OPA policies passed."
